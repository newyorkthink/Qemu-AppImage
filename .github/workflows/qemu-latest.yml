name: QEMU AppImage Latest

on:
  push:
    branches: [ main ]
  schedule:
    # 每天检查一次 QEMU 官方最新稳定版；版本未变化时不重复构建。
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even when the QEMU stable version is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qemu-appimage-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest stable QEMU version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 直接读取 QEMU 官方 GitLab tag，仅接受 x.y.z 稳定版，自动排除 -rc 等预发布版本。
          QEMU_TAG="$(
            git ls-remote --tags --refs https://gitlab.com/qemu-project/qemu.git 'refs/tags/v*' \
              | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "${QEMU_TAG}" ]]; then
            echo "Unable to determine the latest stable QEMU version." >&2
            exit 1
          fi

          QEMU_VERSION="${QEMU_TAG#v}"
          CURRENT_VERSION="$(
            gh release view latest --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' 2>/dev/null \
              | sed -n 's/^QEMU-Version: //p' \
              | head -n 1 \
              || true
          )"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            FORCE_BUILD="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            FORCE_BUILD="${{ inputs.force_build }}"
          else
            FORCE_BUILD="false"
          fi

          echo "qemu_version=${QEMU_VERSION}" >> "${GITHUB_OUTPUT}"

          if [[ "${QEMU_VERSION}" == "${CURRENT_VERSION}" && "${FORCE_BUILD}" != "true" ]]; then
            echo "build_required=false" >> "${GITHUB_OUTPUT}"
            echo "QEMU ${QEMU_VERSION} is already published as latest; skipping build."
          else
            echo "build_required=true" >> "${GITHUB_OUTPUT}"
            echo "Latest stable QEMU: ${QEMU_VERSION}; current published version: ${CURRENT_VERSION:-none}."
          fi

      - name: Build Universal QEMU AppImage
        if: steps.version.outputs.build_required == 'true'
        env:
          QEMU_VERSION: ${{ steps.version.outputs.qemu_version }}
        shell: bash
        run: |
          set -euo pipefail

          # 使用现有快速 Universal 构建脚本，通过 Arch Linux qemu-full 软件包打包，避免重新编译整套 QEMU 源码。
          chmod a+x qemu-universal.sh
          ./qemu-universal.sh

          # 发布前核对实际打包版本必须与 QEMU 官方最新稳定版一致；Arch 尚未同步时停止发布并等待下次检查。
          BUILT_VERSION="$(
            sudo chroot "${GITHUB_WORKSPACE}/arch/root" /usr/bin/qemu-system-x86_64 --version \
              | sed -n 's/^QEMU emulator version \([0-9][0-9.]*\).*/\1/p' \
              | head -n 1
          )"

          if [[ "${BUILT_VERSION}" != "${QEMU_VERSION}" ]]; then
            echo "Built QEMU version ${BUILT_VERSION:-unknown} does not match upstream stable ${QEMU_VERSION}." >&2
            exit 1
          fi

          APPIMAGE="$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f -name '*.AppImage*' -print -quit)"
          if [[ -z "${APPIMAGE}" ]]; then
            echo "QEMU AppImage was not generated." >&2
            exit 1
          fi

          mkdir -p dist
          mv "${APPIMAGE}" "dist/qemu.AppImage"

      - name: Publish Latest release
        if: steps.version.outputs.build_required == 'true'
        env:
          QEMU_VERSION: ${{ steps.version.outputs.qemu_version }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          QEMU-Version: ${QEMU_VERSION}

          ## 中文

          QEMU 官方最新稳定版 AppImage。

          - QEMU 官方版本：v${QEMU_VERSION}
          - 构建方式：基于 Arch Linux qemu-full 软件包的 Universal AppImage
          - 文件：qemu.AppImage
          - Release tag：latest

          ## English

          AppImage build of the latest stable QEMU release.

          - QEMU upstream: v${QEMU_VERSION}
          - Build: Universal AppImage based on the Arch Linux qemu-full package
          - File: qemu.AppImage
          - Release tag: latest
          EOF

          # 新版本构建成功后再删除旧 Release 及其 Release tag；旧 QEMU-git 等资产会随旧 Release 一并删除。
          mapfile -t RELEASE_TAGS < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName'
          )

          for TAG in "${RELEASE_TAGS[@]}"; do
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag -y
          done

          gh release create latest \
            dist/qemu.AppImage \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Latest" \
            --notes-file release-notes.md \
            --latest
