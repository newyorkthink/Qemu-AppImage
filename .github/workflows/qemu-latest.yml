name: QEMU AppImage Latest

on:
  schedule:
    # 每天仅检查一次 QEMU 官方稳定版；版本未变化时不会执行构建。
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even when the QEMU stable version is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qemu-appimage-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest stable QEMU version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 直接读取 QEMU 官方 GitLab tag，仅接受 x.y.z 稳定版，自动排除 -rc 等预发布版本。
          QEMU_TAG="$(
            git ls-remote --tags --refs https://gitlab.com/qemu-project/qemu.git 'refs/tags/v*' \
              | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "${QEMU_TAG}" ]]; then
            echo "Unable to determine the latest stable QEMU version." >&2
            exit 1
          fi

          QEMU_VERSION="${QEMU_TAG#v}"
          CURRENT_VERSION="$(
            gh release view latest --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' 2>/dev/null \
              | sed -n 's/^QEMU-Version: //p' \
              | head -n 1 \
              || true
          )"

          FORCE_BUILD="${{ inputs.force_build }}"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            FORCE_BUILD="false"
          fi

          echo "qemu_tag=${QEMU_TAG}" >> "${GITHUB_OUTPUT}"
          echo "qemu_version=${QEMU_VERSION}" >> "${GITHUB_OUTPUT}"

          if [[ "${QEMU_VERSION}" == "${CURRENT_VERSION}" && "${FORCE_BUILD}" != "true" ]]; then
            echo "build_required=false" >> "${GITHUB_OUTPUT}"
            echo "QEMU ${QEMU_VERSION} is already published as latest; skipping build."
          else
            echo "build_required=true" >> "${GITHUB_OUTPUT}"
            echo "Latest stable QEMU: ${QEMU_VERSION}; current published version: ${CURRENT_VERSION:-none}."
          fi

      - name: Build Universal AppImage
        if: steps.version.outputs.build_required == 'true'
        env:
          QEMU_VERSION: ${{ steps.version.outputs.qemu_version }}
        shell: bash
        run: |
          set -euo pipefail

          # 保留现有 Universal 构建脚本作为稳定基线。
          chmod a+x qemu-universal.sh
          ./qemu-universal.sh

          # 确认 Universal 实际打包的 QEMU 版本与官方最新稳定版一致，避免 Arch 软件包尚未同步时误发布旧版本。
          UNIVERSAL_VERSION="$(
            sudo chroot "${GITHUB_WORKSPACE}/arch/root" /usr/bin/qemu-system-x86_64 --version \
              | sed -n 's/^QEMU emulator version \([0-9][0-9.]*\).*/\1/p' \
              | head -n 1
          )"

          if [[ "${UNIVERSAL_VERSION}" != "${QEMU_VERSION}" ]]; then
            echo "Universal QEMU version ${UNIVERSAL_VERSION:-unknown} does not match upstream ${QEMU_VERSION}." >&2
            exit 1
          fi

          UNIVERSAL_APPIMAGE="$(find "${GITHUB_WORKSPACE}" -maxdepth 1 -type f -name '*.AppImage*' -print -quit)"
          if [[ -z "${UNIVERSAL_APPIMAGE}" ]]; then
            echo "Universal AppImage was not generated." >&2
            exit 1
          fi

          mkdir -p dist
          mv "${UNIVERSAL_APPIMAGE}" "dist/QEMU-latest-universal-x86_64.AppImage"

      - name: Build Jammy AppImage
        if: steps.version.outputs.build_required == 'true'
        env:
          QEMU_TAG: ${{ steps.version.outputs.qemu_tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo $PATH
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils \
           bison \
           libcbor-dev \
           docutils-common \
           flex \
           gettext \
           git \
           libaio-dev \
           libaio1 \
           libbluetooth-dev \
           libbrlapi-dev \
           libbz2-dev \
           libcap-ng-dev \
           libcapstone-dev \
           libcurl4-gnutls-dev \
           libfdt-dev \
           libglib2.0-dev \
           libgtk-3-dev \
           libibverbs-dev \
           libiscsi-dev \
           libiscsi7 \
           libjpeg8-dev \
           liblzo2-dev \
           libncurses5-dev \
           libnfs* \
           libnuma-dev \
           libpciaccess-dev \
           libpciaccess0 \
           libpixman-1-0 \
           libpixman-1-dev \
           librbd-dev \
           librdmacm-dev \
           libsasl2-dev \
           libsdl2-dev \
           libseccomp-dev \
           libslirp-dev \
           libslirp0 \
           libsnappy-dev \
           libspice-protocol-dev \
           libspice-server-dev \
           libspice-server1 \
           libssh-dev \
           libusb* \
           libvde-dev \
           libvdeplug-dev \
           libvirglrenderer-dev \
           libvirglrenderer1 \
           libvte-2.91-dev \
           libxen-dev \
           libxml2-dev \
           libxml2-utils \
           libyajl-dev \
           libyajl2 \
           libzstd-dev \
           libzstd1 \
           ninja-build \
           pip \
           pkg-config \
           python3-venv \
           slirp* \
           valgrind \
           virgl-server \
           xfslibs-dev \
           xsltproc \
           zlib1g-dev \
           liburing-dev \
           libcap-ng-dev \
           libvdeplug-dev \
           libbrlapi-dev \
           librados-dev \
           librbd-dev \
           libbz2-dev \
           liblz4-dev \
           libasound2-dev \
           libepoxy-dev \
           libiconv-hook-dev \
           libunistring-dev
          wget -q "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.7/gnutls-3.7.11.tar.xz" && tar xf gnutls-3.7.11.tar.xz && cd ./gnutls-3.7.11 && ./configure && make && sudo make install && cd ..
          pkg-config --modversion gnutls
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy ; chmod a+x linuxdeploy
          wget -q "https://github.com/VHSgunzo/uruntime/releases/download/v0.3.9/uruntime-appimage-dwarfs-x86_64" -O uruntime ; chmod a+x uruntime
          sudo pip3 install meson
          wget -c -q "https://download.gnome.org/sources/glib/2.80/glib-2.80.2.tar.xz"
          tar -xf glib-2.80.2.tar.xz
          cd glib-2.80.2
          meson setup _build
          meson compile -C _build
          sudo meson install -C _build
          cd ${GITHUB_WORKSPACE}
          mkdir lucas
          mkdir -p lucas/usr/
          mkdir -p lucas/usr/lib/
          mkdir -p lucas/usr/share/
          cp -r /usr/share/mime/ lucas/usr/share/
          git clone https://gitlab.com/qemu-project/qemu.git
          cd qemu
          git checkout "${QEMU_TAG}"
          git submodule init
          git submodule update --recursive
          ./configure --disable-docs \
           --enable-alsa \
           --enable-gio \
           --enable-gnutls \
           --enable-gtk \
           --enable-guest-agent \
           --enable-kvm \
           --enable-libssh \
           --enable-libudev \
           --enable-libusb \
           --enable-modules \
           --enable-nettle \
           --enable-opengl \
           --enable-pa \
           --enable-pixman \
           --enable-sdl \
           --enable-slirp \
           --enable-slirp-smbd \
           --enable-spice \
           --enable-spice-protocol \
           --enable-system \
           --enable-user \
           --enable-virglrenderer \
           --enable-usb-redir \
           --prefix=${GITHUB_WORKSPACE}/lucas/usr/
          make
          make install
          cd ${GITHUB_WORKSPACE}
          cp -f AppRun ${GITHUB_WORKSPACE}/lucas/AppRun.real
          cp -f AppRun.wrapper ${GITHUB_WORKSPACE}/lucas/AppRun
          chmod +x ${GITHUB_WORKSPACE}/lucas/AppRun ${GITHUB_WORKSPACE}/lucas/AppRun.real
          cp -f qemu.desktop ${GITHUB_WORKSPACE}/lucas/
          cp -f qemu_logo_no_text.svg ${GITHUB_WORKSPACE}/lucas/
          cp -f libunionpreload.so ${GITHUB_WORKSPACE}/lucas/
          find -name 'linuxdeploy**' -type f -exec {} --appdir ${GITHUB_WORKSPACE}/lucas/ \;
          cd ${GITHUB_WORKSPACE} && cp qemu.desktop lucas/ && find lucas/ -depth -iname 'libglib-2.0.so.0' -type f -delete
          find ${GITHUB_WORKSPACE}/lucas/usr/bin/ -type f | xargs strip
          find ${GITHUB_WORKSPACE}/lucas/usr/libexec/ -type f | xargs strip
          export ARCH=x86_64
          export VERSION=git
          cd ${GITHUB_WORKSPACE}
          ./uruntime --appimage-mkdwarfs -f --set-owner 0 --set-group 0 --no-history --no-create-timestamp --compression zstd:level=22 -S26 -B8 --header uruntime -i ${GITHUB_WORKSPACE}/lucas/ -o QEMU-"$VERSION"-"$ARCH".AppImage
          mv QEMU-"$VERSION"-"$ARCH".AppImage dist/QEMU-latest-jammy-x86_64.AppImage

      - name: Publish only latest release
        if: steps.version.outputs.build_required == 'true'
        env:
          QEMU_VERSION: ${{ steps.version.outputs.qemu_version }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          QEMU-Version: ${QEMU_VERSION}

          ## 中文

          这是跟踪 QEMU 官方最新稳定版的非官方 QEMU AppImage 构建。

          - QEMU 官方版本：v${QEMU_VERSION}
          - Universal：基于 Arch Linux 运行时环境打包
          - Jammy：在 Ubuntu 22.04 上从 QEMU 官方稳定版源码构建
          - Release tag 始终固定为：latest

          ## English

          Unofficial QEMU AppImage build tracking the latest stable QEMU release.

          - QEMU upstream: v${QEMU_VERSION}
          - Universal: Arch-based runtime bundle
          - Jammy: source build on Ubuntu 22.04
          - Release tag is always: latest
          EOF

          # 新版本构建全部成功后，删除旧 Release 及其 Release tag；仓库最终只保留 latest Release。
          mapfile -t RELEASE_TAGS < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName --jq '.[].tagName'
          )

          for TAG in "${RELEASE_TAGS[@]}"; do
            gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag -y
          done

          gh release create latest \
            dist/QEMU-latest-universal-x86_64.AppImage \
            dist/QEMU-latest-jammy-x86_64.AppImage \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "QEMU AppImage ${QEMU_VERSION} / QEMU AppImage 最新版 ${QEMU_VERSION}" \
            --notes-file release-notes.md \
            --latest
